name: Build and publish site
on:
    push:
        branches:
            - master
        paths-ignore:
            - "LICENSE"
            - "**.md"
            - ".github/ISSUE_TEMPLATE/**"
            - ".github/dependabot.yml"
    workflow_dispatch:
permissions:
    contents: read
    pages: write
    packages: read
    id-token: write
jobs:
    build:
        uses: Origami-Systems/workflows/.github/workflows/astro-build.yml@main
